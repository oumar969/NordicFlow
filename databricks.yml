bundle:
  name: nordicflow-data-platform

sync:
  include:
    - src/backend/NordicFlow.Infrastructure/Persistence/schema.sql

variables:
  alert_email:
    description: Distribution list for data-quality incidents
  catalog:
    default: nordicflow_dev
  event_hubs_namespace:
    description: Event Hubs namespace FQDN without port
  oauth_callback_jar:
    description: Workspace or Volume URI of the shaded OAuth callback JAR
  bronze_checkpoint:
    description: Durable ADLS/Volume checkpoint path unique to this query
  spark_version:
    default: 16.4.x-scala2.12
  node_type_id:
    default: Standard_D4ds_v5
  postgres_host:
    description: Azure PostgreSQL hostname
  postgres_database:
    default: nordicflow
  postgres_user:
    description: Entra service-principal database role
  azure_service_credential:
    default: nordicflow-postgres-runtime
    description: Unity Catalog service credential used for Azure token acquisition
  postgres_bootstrap_user:
    description: Temporary PostgreSQL Entra administrator role used by the bootstrap job
  postgres_bootstrap_credential:
    default: nordicflow-azure-services
  postgres_runtime_principal_object_id:
    description: Object ID of the Databricks jobs user-assigned managed identity

resources:
  jobs:
    postgres_bootstrap:
      name: NordicFlow PostgreSQL bootstrap
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: bootstrap_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            driver_node_type_flexibility:
              alternate_node_type_ids:
                - Standard_D4ads_v5
                - Standard_D4ds_v4
            worker_node_type_flexibility:
              alternate_node_type_ids:
                - Standard_D4ads_v5
                - Standard_D4ds_v4
            num_workers: 1
            data_security_mode: SINGLE_USER
      tasks:
        - task_key: apply_schema_and_runtime_grants
          job_cluster_key: bootstrap_cluster
          spark_python_task:
            python_file: ./data-platform/database/bootstrap_postgres.py
            parameters:
              - --postgres-host
              - ${var.postgres_host}
              - --postgres-database
              - ${var.postgres_database}
              - --bootstrap-user
              - ${var.postgres_bootstrap_user}
              - --bootstrap-credential
              - ${var.postgres_bootstrap_credential}
              - --runtime-principal-name
              - ${var.postgres_user}
              - --runtime-principal-object-id
              - ${var.postgres_runtime_principal_object_id}
          libraries:
            - pypi:
                package: psycopg[binary]==3.2.10

    bronze_ingestion:
      name: NordicFlow Event Hubs to Bronze
      continuous:
        pause_status: PAUSED
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: bronze_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            driver_node_type_flexibility:
              alternate_node_type_ids:
                - Standard_D4ads_v5
                - Standard_D4ds_v4
            worker_node_type_flexibility:
              alternate_node_type_ids:
                - Standard_D4ads_v5
                - Standard_D4ds_v4
            num_workers: 2
            data_security_mode: SINGLE_USER
      tasks:
        - task_key: ingest_order_events
          job_cluster_key: bronze_cluster
          spark_python_task:
            python_file: ./data-platform/bronze/event_hubs_to_bronze.py
            parameters:
              - --event-hubs-namespace
              - ${var.event_hubs_namespace}
              - --event-hub-name
              - order-events
              - --bronze-table
              - ${var.catalog}.bronze.order_created_raw
              - --checkpoint-location
              - ${var.bronze_checkpoint}
              - --max-offsets-per-trigger
              - "10000"
          libraries:
            - jar: ${var.oauth_callback_jar}
    quarantine_monitor:
      name: NordicFlow quarantine-rate monitor
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"
        timezone_id: Europe/Berlin
        pause_status: UNPAUSED
      email_notifications:
        on_failure: ["${var.alert_email}"]
        no_alert_for_skipped_runs: true
      tasks:
        - task_key: monitor_quarantine_rate
          spark_python_task:
            python_file: ./data-platform/monitoring/quarantine_rate.py
            parameters: []
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "4"
    silver_processing:
      name: NordicFlow Bronze to Silver
      max_concurrent_runs: 1
      job_clusters:
        - job_cluster_key: silver_cluster
          new_cluster:
            spark_version: ${var.spark_version}
            node_type_id: ${var.node_type_id}
            driver_node_type_flexibility:
              alternate_node_type_ids:
                - Standard_D4ads_v5
                - Standard_D4ds_v4
            worker_node_type_flexibility:
              alternate_node_type_ids:
                - Standard_D4ads_v5
                - Standard_D4ds_v4
            num_workers: 2
            data_security_mode: SINGLE_USER
      tasks:
        - task_key: transform_order_events
          job_cluster_key: silver_cluster
          spark_python_task:
            python_file: ./data-platform/silver/order_created_silver.py
            parameters:
              - --bronze-table
              - ${var.catalog}.bronze.order_created_raw
              - --silver-table
              - ${var.catalog}.silver.order_created
              - --quarantine-table
              - ${var.catalog}.silver.order_created_quarantine
        - task_key: publish_operational_metrics
          depends_on:
            - task_key: transform_order_events
          job_cluster_key: silver_cluster
          spark_python_task:
            python_file: ./data-platform/monitoring/publish_operational_metrics.py
            parameters:
              - --bronze-table
              - ${var.catalog}.bronze.order_created_raw
              - --window-start
              - "{{job.start_time.iso_datetime}}"
              - --pipeline-run-id
              - "{{job.run_id}}"
              - --postgres-host
              - ${var.postgres_host}
              - --postgres-database
              - ${var.postgres_database}
              - --postgres-user
              - ${var.postgres_user}
              - --azure-service-credential
              - ${var.azure_service_credential}
              - --quarantine-threshold
              - "0.01"
          libraries:
            - pypi:
                package: psycopg[binary]==3.2.10

targets:
