      event_hubs_namespace: evhns-nf-dev-lxo2ri.servicebus.windows.net
      oauth_callback_jar: dbfs:/FileStore/jars/nordicflow-eventhubs-oauth-all.jar
      bronze_checkpoint: abfss://bronze@stnfdevlxo2ri.dfs.core.windows.net/checkpoints/order-events
      postgres_host: psql-nf-dev-lxo2ri.postgres.database.azure.com
      postgres_database: nordicflow
      postgres_user: id-databricks-jobs-nf-dev-lxo2ri
      azure_service_credential: nordicflow-postgres-runtime
      postgres_bootstrap_user: ac-databricks-nf-dev-lxo2ri
      postgres_bootstrap_credential: nordicflow-azure-services
      postgres_runtime_principal_object_id: d13065b9-5b5a-463b-ba6e-1a58d69ad1a9
