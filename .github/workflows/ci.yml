name: NordicFlow CI

on:
  pull_request:
  push:
    branches: [main, platform-foundation]
  workflow_dispatch:
    inputs:
      deployment_action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
          - databricks-deploy

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x
      - name: Restore
        run: dotnet restore src/backend/NordicFlow.slnx --configfile NuGet.Config
      - name: Build
        run: dotnet build src/backend/NordicFlow.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test src/backend/NordicFlow.slnx --configuration Release --no-build --verbosity normal
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Check Python syntax
        run: python -m compileall -q data-platform
      - name: Install PySpark test dependencies
        run: pip install -r data-platform/requirements-test.txt
      - name: Run PySpark DataFrame tests
        run: pytest -q data-platform/tests
      - name: Build Event Hubs OAuth callback
        working-directory: data-platform/connectors/eventhubs-oauth
        run: mvn --batch-mode --no-transfer-progress verify
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dashboard dependencies
        working-directory: src/frontend
        run: npm ci
      - name: Test dashboard
        working-directory: src/frontend
        run: npm test
      - name: Build dashboard
        working-directory: src/frontend
        run: npm run build

  terraform-validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  terraform-plan:
    if: github.event_name == 'workflow_dispatch' && (inputs.deployment_action == 'plan' || inputs.deployment_action == 'apply')
    needs: [application, terraform-validate]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: development
    env:
      ARM_USE_OIDC: true
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8
      - name: Initialize remote state
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=nordicflow-tfstate-rg" \
            -backend-config="storage_account_name=nordicflowtfstate969" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=development.tfstate" \
            -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -backend-config="tenant_id=${{ secrets.AZURE_TENANT_ID }}" \
            -backend-config="client_id=${{ secrets.AZURE_CLIENT_ID }}" \
            -backend-config="use_oidc=true" \
            -backend-config="use_azuread_auth=true"
      - name: Plan
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_environment: dev
          TF_VAR_postgres_administrator_object_id: ${{ secrets.POSTGRES_ADMIN_OBJECT_ID }}
          TF_VAR_postgres_administrator_name: ${{ vars.POSTGRES_ADMIN_NAME }}
        run: terraform plan -input=false -out=tfplan
      - name: Apply
        if: inputs.deployment_action == 'apply'
        run: terraform apply -input=false -auto-approve tfplan

  databricks-deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deployment_action == 'databricks-deploy'
    needs: [application, terraform-validate]
    runs-on: ubuntu-latest
    environment: development
    env:
      DATABRICKS_AUTH_TYPE: azure-cli
    steps:
      - uses: actions/checkout@v6
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Install Databricks CLI
        uses: databricks/setup-cli@main
      - name: Validate Databricks bundle
        run: databricks bundle validate --target dev
      - name: Deploy Databricks bundle
        run: databricks bundle deploy --target dev
